<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Session — Do Not Disturb</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap');

  :root{
    --ink: #0F1524;
    --panel: #161D30;
    --amber: #F2A03D;
    --amber-dim: #7A5222;
    --paper: #EFEAE0;
    --slate: #8A93B0;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: var(--ink);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(242,160,61,0.08), transparent 60%);
    color: var(--paper);
    font-family: 'Space Grotesk', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px;
  }

  .sign{
    text-align: center;
    max-width: 900px;
    padding: 0 40px;
  }

  .lamp{
    font-size: clamp(3rem, 6vw, 4.5rem);
    margin: 0 auto 32px;
    animation: breathe 3.2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(242,160,61,0.35));
  }

  @keyframes breathe{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.8rem, 6vw, 5rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--paper);
    margin-bottom: 20px;
  }

  .sub{
    color: var(--slate);
    font-size: clamp(1rem, 1.6vw, 1.3rem);
    line-height: 1.5;
    max-width: 46ch;
    margin: 0 auto;
  }
  @media (prefers-reduced-motion: reduce){
      .lamp{
animation: none;
} 
}
</style>
 </head>
<body>
<div class="sign"> 
<div class="lamp">🔇</div>
<h1>Working on my project</h1> 
<p class="sub">DO NOT DISTURB </p>
</div>
</body>
</html>
