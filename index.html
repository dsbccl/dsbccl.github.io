<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apna Bazar – Groceries from your local shops</title>
<meta name="description" content="Order groceries from shops in your own area. Pay on delivery.">
<meta property="og:type" content="website"><meta property="og:title" content="Apna Bazar"><meta property="og:description" content="Order groceries from shops in your own area. Pay on delivery."><meta property="og:image" content="og-image.png"><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#1F6B3A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8F4;--ink:#1B2A22;--mute:#5E6E64;--line:#DCE3DB;--green:#1F6B3A;--green-d:#14502A;--gold:#E8A317;--red:#B3341F;--card:#fff}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:16px/1.5 Hind,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
h1,h2,h3,.brand{font-family:"Baloo 2",sans-serif;line-height:1.2}
a{color:var(--green)}button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;box-shadow:0 1px 6px rgba(20,40,28,.18)}
.brand{font-size:1.5rem;font-weight:800;color:#fff;text-decoration:none}
.pin{background:#fff;color:var(--ink);border-radius:99px;padding:5px 14px;font-size:.9rem;text-decoration:none}
main{max-width:1000px;margin:0 auto;padding:18px 16px}
.pg{font-size:1.7rem;margin-bottom:12px}h2{font-size:1.25rem;margin:22px 0 10px}
.muted{color:var(--mute);font-size:.92rem}.err{color:var(--red);font-size:.9rem;margin-top:8px}
.hero{padding:22px 0 6px}.hero h1{font-size:clamp(1.9rem,6vw,3rem);font-weight:800;max-width:18ch}.hero p{color:var(--mute);margin:8px 0 16px}
.trust{display:flex;gap:6px 18px;flex-wrap:wrap;list-style:none;padding:0;margin:14px 0;font-size:.9rem;color:var(--green-d);font-weight:500}.trust li::before{content:"\2713";margin-right:6px;font-weight:700}
.pinbox{display:flex;gap:8px;max-width:360px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
label{display:block;margin:12px 0 4px;font-weight:500}
.btn{display:inline-block;background:var(--green);color:#fff;border:0;border-radius:8px;padding:10px 18px;text-decoration:none;text-align:center;font-weight:500}
.btn:hover{background:var(--green-d)}.btn.wide{display:block;width:100%;margin-top:12px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:#F0F3EE}
.btn.danger{background:var(--red)}.btn.out{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn:disabled{background:#B9C4BC;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 12px;text-align:center;text-decoration:none;color:var(--ink);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(20,40,28,.08)}
.p .img{position:relative;overflow:hidden;flex:none;aspect-ratio:4/3;background:#E7EFE4;display:grid;place-items:center;font:800 2.4rem "Baloo 2";color:var(--green)}
.p .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.p .b{position:relative;z-index:1;background:#fff;border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.p h3{font-size:1.02rem}.p .s,.s{font-size:.85rem;color:var(--mute)}.p .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.add{background:var(--green);color:#fff;border:0;border-radius:8px;padding:6px 14px}.add:disabled{background:#B9C4BC}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}.tot{font-size:1.1rem}
.menu{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.menu a{display:flex;justify-content:space-between;padding:14px 16px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}.menu a:last-child{border:0}.menu a:hover{background:#F0F3EE}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}.seg button{flex:1;padding:10px;border:0;background:#fff}.seg .on{background:var(--green);color:#fff}
.consentbox{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px 16px;font-size:.92rem}
.consentbox table{width:100%;border-collapse:collapse;margin:8px 0}.consentbox th,.consentbox td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}.consentbox th{font-size:.78rem;text-transform:uppercase;color:var(--mute)}
.ck{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-weight:400}.ck input{width:auto;margin-top:5px}
.danger-zone{border:1px solid var(--red);border-radius:12px;padding:14px 16px;margin-top:18px;background:#FFF8F6}
.doc h3{font-size:1.05rem;margin:16px 0 4px}.doc ul{padding-left:20px}.doc p,.doc li{margin-bottom:4px}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:.9rem;text-align:center}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:.72rem;color:var(--mute);text-decoration:none;position:relative}
#tabs a.on{color:var(--green);font-weight:600}#tabs svg{width:22px;height:22px}
#cc{position:absolute;top:2px;left:calc(50% + 4px);background:var(--gold);color:#000;border-radius:99px;font-size:.65rem;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}#toast.on{opacity:1}
#cookie{position:fixed;left:10px;right:10px;bottom:72px;z-index:15;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.85rem;box-shadow:0 4px 18px rgba(0,0,0,.12)}
@media(min-width:760px){#tabs{left:50%;right:auto;transform:translateX(-50%);width:560px;bottom:12px;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.12)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.strip .p{min-width:165px;max-width:165px;scroll-snap-align:start}
.recent{margin:10px 0 4px}.lnk{background:none;border:0;color:var(--green);text-decoration:underline;padding:0 6px}
.sk .img,.sk i{background:linear-gradient(90deg,#E7EFE4 25%,#F3F7F1 50%,#E7EFE4 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.sk i{display:block;height:12px;border-radius:6px;margin:6px 0}
@keyframes sh{to{background-position:-200% 0}}
strong,.price{font-variant-numeric:tabular-nums}
.pr{display:flex;flex-direction:column;line-height:1.3} .mrp{display:block;font-size:.85rem;color:var(--mute)}
.rs{margin-right:30px}
.off{display:block;font-size:.8rem;font-weight:600;color:var(--green-d)};margin-right:20px}.mrp s{text-decoration-thickness:1px}.off{font-size:.8rem;font-weight:600;color:var(--green-d)}
</style></head>
<body>
<header class="top"><a class="brand" href="#/home">Apna Bazar</a><a class="pin" id="pin" href="#/pincode">Enter pincode</a></header>
<main id="view"></main>
<div id="cookie" hidden><span>Essential browser storage only: it keeps your cart, pincode and sign-in safety checks. No advertising or tracking cookies. <a href="#/privacy">Privacy Notice</a></span><button class="btn" id="cookieOk">Acknowledge</button></div>
<nav id="tabs" aria-label="Main">
<a data-t="home" href="#/home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
<a data-t="products" href="#/products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>Products</a>
<a data-t="search" href="#/search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>Search</a>
<a data-t="cart" href="#/cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11h10L20 7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>Cart<span id="cc" hidden>0</span></a>
<a data-t="orders" href="#/orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Orders</a>
<a data-t="account" href="#/account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Account</a>
</nav>
<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $ = s => document.querySelector(s);
const rupees = n => "\u20B9\u00A0" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });   // symbol, then a gap, then the amount
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const TS = () => firebase.firestore.FieldValue.serverTimestamp();
const go = h => { location.hash = h; };
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2800); }
const view = h => { $("#view").innerHTML = h; if (lastHash !== location.hash) { window.scrollTo(0, 0); lastHash = location.hash; } };

let products = store.get("ab_pcache", []), loaded = store.get("ab_pcache", []).length > 0, sugFn = null, lastHash = "", cart = store.get("ab_cart", {}), user = null, profile = null, parentStatus = "", parentMode = false;
let area = store.get("ab_area", ""), cat = "All", mode = "adult", gridFn = null, reqUnsub = null;
const visible = () => products.filter(p => String(p.pincode) === area);
const cartItems = () => Object.entries(cart).map(([id, qty]) => ({ p: products.find(x => x.id === id), qty })).filter(x => x.p);
const cartSum = () => cartItems().reduce((s, x) => s + x.p.price * x.qty, 0);
const saveCart = () => store.set("ab_cart", cart);
const DELIVERY_CHARGE = 20;   // flat per order (same-pincode delivery); the customer sees it before ordering
const totalRows = () => `<div class="line"><span>Items total</span><strong>${rupees(cartSum())}</strong></div><div class="line"><span>Delivery charge</span><strong>${rupees(DELIVERY_CHARGE)}</strong></div><div class="line tot"><span>Total to pay</span><strong>${rupees(cartSum() + DELIVERY_CHARGE)}</strong></div>`;
const agoText = t => { const s = t?.seconds; if (!s) return "Just now"; const m = Math.floor((Date.now() / 1000 - s) / 60); return m < 1 ? "Just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.floor(m / 60) + " h ago" : new Date(s * 1000).toLocaleDateString("en-IN"); };
const signedIn = () => user && !user.isAnonymous;

/* ---------- Legal text ---------- */
const DATA_TABLE = `<table><tr><th>Personal data</th><th>Purpose</th></tr><tr><td>Name and email (from Google)</td><td>Create and secure your account</td></tr><tr><td>Phone, delivery address, pincode</td><td>Deliver your orders</td></tr><tr><td>Order history</td><td>Order tracking, support and accounts</td></tr></table>`;
const INFO = {
  terms: ["Terms of Use", `<p>Apna Bazar connects you with shops in your area. Prices and stock are set by each shop. Orders are paid in cash on delivery. A shop may cancel an order if an item is out of stock.</p>`],
  privacy: ["Privacy Notice", `<h3>Who we are</h3><p>Apna Bazar is a local grocery ordering service. For your personal data we act as the Data Fiduciary under the Digital Personal Data Protection Act, 2023 (DPDP Act).</p>
  <h3>Data we process, and why</h3>${DATA_TABLE}
  <h3>Who can see it</h3><p>The shop sees the name, phone and address needed to prepare your order. The delivery partner sees them only to deliver it. Data is stored on Google Cloud Firestore. We do not sell your data or use it for advertising.</p>
  <h3>How long we keep it</h3><p>Account details are kept until you delete your account. Order records may be retained for as long as accounting and legal obligations require.</p>
  <h3>Your rights</h3><ul><li>Access a summary of your data, from Account or by email.</li><li>Correct your details in Account, My details.</li><li>Withdraw consent and erase your account at any time in Account, Privacy &amp; consents.</li><li>Seek grievance redressal, and nominate a person to exercise your rights if you die or cannot act.</li></ul>
  <h3>Children (under 18)</h3><p>A child can use Apna Bazar only after a parent or guardian verifies their email address and approves the account. We do not track or profile children and show no advertising.</p>
  <h3>Grievances</h3><p>Write to support.dsbccl@gmail.com. If your complaint is not resolved, you may approach the Data Protection Board of India.</p>`]
};
const docPage = k => { gridFn = null; view(`<h1 class="pg">${INFO[k][0]}</h1><div class="card doc">${INFO[k][1]}</div><a class="btn ghost" href="javascript:history.back()">Back</a>`); };

/* ---------- Router ---------- */
const V = {};
function route(){
  const [path, q] = (location.hash.slice(2) || "home").split("?"), [pg, sub] = path.split("/");
  gridFn = null; sugFn = null;
  (V[pg] || V.home)(sub, q);
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.t === pg || (pg === "checkout" && a.dataset.t === "cart") || (pg === "signin" && a.dataset.t === "account")));
  $("#pin").textContent = area ? "Pincode " + area : "Enter pincode";
  badge();
}
window.addEventListener("hashchange", route);
function badge(){ const n = Object.values(cart).reduce((a, b) => a + b, 0), c = $("#cc"); c.textContent = n; c.hidden = !n; }
function needSignin(){ if (signedIn()) return false; store.set("ab_next", location.hash || "#/home"); go("#/signin"); return true; }
if (!store.get("ab_cookie", false)) $("#cookie").hidden = false;
$("#cookieOk").onclick = () => { store.set("ab_cookie", true); $("#cookie").hidden = true; };

/* ---------- Products ---------- */
try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch {}   // Firestore keeps its own offline copy too
function cacheProducts(){
  const slim = products.map(p => ({ ...p, imageUrl: (p.imageUrl || "").length < 15000 ? p.imageUrl : "" }));
  try { localStorage.setItem("ab_pcache", JSON.stringify(slim)); } catch { try { localStorage.setItem("ab_pcache", JSON.stringify(slim.map(p => ({ ...p, imageUrl: "" })))); } catch {} }
}
const PTTL = 5 * 60 * 1000;   // products are re-read from the database at most once per 5 minutes per device
let pFetch = null;
function afterProducts(){
  const h = location.hash;
  if ($("#g") || $("#sg")) { if ($("#sq") || h.startsWith("#/products")) drawGrid(); else route(); }
  else if (!h || h === "#/home" || h === "#/cart") route();
}
function fetchProducts(force){
  const age = Date.now() - store.get("ab_pcache_t", 0);
  if (!force && products.length && age < PTTL) { console.info("[cache] products: using saved copy,", products.length, "items,", Math.round(age / 1000) + "s old (no database call)"); loaded = true; return Promise.resolve(); }
  if (pFetch) return pFetch;
  console.info("[cache] products: reading from database");
  pFetch = db.collection("products").get().then(snap => {
    products = snap.docs.map(d => ({ id: d.id, ...d.data() })); loaded = true;
    store.set("ab_pcache_t", Date.now()); cacheProducts(); afterProducts();
  }).catch(() => { loaded = true; toast("Could not refresh. Showing saved items."); afterProducts(); }).finally(() => { pFetch = null; });
  return pFetch;
}
fetchProducts();
document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchProducts(); });
const updatedAgo = () => { const t = store.get("ab_pcache_t", 0); if (!t) return ""; const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.floor(m / 60) + " h ago"; };
const card = p => { const n = cart[p.id] || 0, out = !(p.stock > 0);
  return `<article class="p"><div class="img">${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="" loading="lazy">` : esc((p.name || "?")[0].toUpperCase())}</div>
  <div class="b"><h3>${esc(p.name)}</h3><span class="s">${esc(p.shopName)} · ${esc(p.unit)}</span><div class="row"><span class="pr"><strong>${rupees(p.price)}</strong>${p.mrp > p.price ? `<span><span class="mrp">MRP \u20B9\u00A0<s>${Number(p.mrp).toLocaleString("en-IN", { maximumFractionDigits: 2 })}</s></span><span class="off">${Math.round((p.mrp - p.price) / p.mrp * 100)}% off</span></span>` : ""}</span>
  ${out ? `<span class="s">Out of stock</span>` : n ? `<span class="qty"><button data-m="${p.id}" aria-label="Remove one">−</button>${n}<button data-a="${p.id}" aria-label="Add one">+</button></span>` : `<button class="add" data-a="${p.id}">Add</button>`}</div></div></article>`; };
const skel = n => "<div class='p sk'><div class='img'></div><div class='b'><i></i><i></i></div></div>".repeat(n);
const loadingNow = () => !loaded && !products.length;
const gridHTML = l => loadingNow() ? `<div class="grid">${skel(6)}</div>` : l.length ? `<div class="grid">${l.map(card).join("")}</div>` : `<p class="muted">${area ? "No products found." : "Enter your pincode on the Home page to see products."}</p>`;
const stripHTML = (t, l) => loadingNow() ? `<h2>${t}</h2><div class="strip">${skel(4)}</div>` : l.length ? `<h2>${t}</h2><div class="strip">${l.map(card).join("")}</div>` : "";
const drawGrid = () => { if (gridFn && $("#g")) $("#g").innerHTML = gridFn(); if (sugFn && $("#sg")) $("#sg").innerHTML = sugFn(); };

/* ---------- Smart search: Hindi / Bengali / English names, spelling mistakes, suggestions ---------- */

const SYNMAP = {}; SYN.forEach((g, i) => g.forEach(w => { SYNMAP[w] = i; }));
const toks = s => String(s || "").toLowerCase().replace(/[^a-z0-9\u0900-\u097F\u0980-\u09FF]+/g, " ").split(" ").filter(Boolean);
function lev(a, b){ const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }
const gmemo = {};
function grp(t){ if (t in gmemo) return gmemo[t]; let g = SYNMAP[t] ?? -1;
  if (g < 0 && t.length >= 4) for (const w in SYNMAP) if (w.length >= 4 && Math.abs(w.length - t.length) <= 1 && lev(t, w) <= (t.length > 6 ? 2 : 1)) { g = SYNMAP[w]; break; }
  return (gmemo[t] = g); }
function scoreP(p, qt){ const pt = toks((p.name || "") + " " + (p.category || "")); let sc = 0;
  for (const q of qt) { const g = grp(q);
    for (const t of pt) { if (t === q) sc += 5; else if (g >= 0 && grp(t) === g) sc += 4; else if (q.length >= 3 && (t.includes(q) || (t.length >= 3 && q.includes(t)))) sc += 3; else if (q.length >= 4 && lev(q, t) <= (q.length > 6 ? 2 : 1)) sc += 2; } }
  return sc; }
const searchProducts = q => { const qt = toks(q); return visible().map(p => [scoreP(p, qt), p]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).map(x => x[1]); };
const dayN = Math.floor(Date.now() / 864e5), hsh = s => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0) + dayN) | 0, 7);
function suggest(n = 8, ex = [], hintCat){
  return visible().filter(p => p.stock > 0 && !ex.includes(p.id)).sort((a, b) => ((hintCat && (b.category === hintCat) - (a.category === hintCat)) || hsh(a.id) - hsh(b.id))).slice(0, n); }
function change(id, d){
  const p = products.find(x => x.id === id); if (!p) return;
  const n = (cart[id] || 0) + d;

}

const CODE_CH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newOrderCode(){   // 4 digits + 2 or 3 letters/digits = 6 or 7 characters
  const r = new Uint32Array(8); crypto.getRandomValues(r);
  let c = ""; for (let i = 0; i < 4; i++) c += r[i] % 10;
  for (let i = 0, n = 2 + (r[4] % 2); i < n; i++) c += CODE_CH[r[5 + i] % CODE_CH.length];
  return c;
}
async function place(){
  const name = $("#cn").value.trim(), phone = $("#cp").value.replace(/\D/g, "").slice(-10), address = $("#ca").value.trim(), err = $("#ce");
  if (name.length < 2) return err.textContent = "Enter your name.";
  if (!/^[6-9]\d{9}$/.test(phone)) return err.textContent = "Enter a valid 10-digit mobile number.";
  if (address.length < 10) return err.textContent = "Enter your full address.";
  const items = cartItems(); if (!items.length) return;
  const btn = $("#place"); btn.disabled = true; err.textContent = "";
  const orderRef = db.collection("orders").doc(newOrderCode());
  try {
    await db.runTransaction(async t => {
      const refs = items.map(x => db.collection("products").doc(x.p.id)), snaps = await Promise.all(refs.map(r => t.get(r)));
      snaps.forEach((s, i) => { if (!s.exists || s.data().stock < items[i].qty) throw new Error("“" + items[i].p.name + "” is no longer available in that quantity."); });
      snaps.forEach((s, i) => t.update(refs[i], { stock: s.data().stock - items[i].qty }));
      t.set(orderRef, { customerUid: user.uid, customerName: name, customerPhone: phone, address, pincode: area,
        items: snaps.map((s, i) => ({ productId: items[i].p.id, name: s.data().name, price: s.data().price, qty: items[i].qty, shopId: s.data().shopId, shopName: s.data().shopName })),
        shopIds: [...new Set(snaps.map(sn => sn.data().shopId))], total: snaps.reduce((a, s, i) => a + s.data().price * items[i].qty, 0), deliveryCharge: DELIVERY_CHARGE,
        status: "pending", settlement: "none", createdAt: TS(), updatedAt: TS() });
    });
    await db.collection("customers").doc(user.uid).set({ name, phone, address, pincode: area, email: user.email || "" }, { merge: true });
    profile = { ...profile, name, phone, address, pincode: area };
    cart = {}; saveCart(); try { localStorage.removeItem("ab_orders_" + user.uid); } catch {} fetchProducts(true); toast("Order placed. ID: " + orderRef.id + ". Pay cash on delivery."); go("#/orders");
  } catch (e) { err.textContent = e.message || "Could not place the order."; btn.disabled = false; fetchProducts(true); }
}

const authS = () => store.get("ab_auth", { fails: 0, lockUntil: 0, last: 0 });
function guard(){ const s = authS(), n = Date.now();
  if (n < s.lockUntil) return "Too many failed attempts. Try again in " + Math.ceil((s.lockUntil - n) / 6e4) + " minute(s).";
  if (n - s.last < GAP) return "Please wait a few seconds before trying again.";
  s.last = n; store.set("ab_auth", s); return ""; }
function failed(){ const s = authS(); s.fails++; if (s.fails >= MAX) { s.lockUntil = Date.now() + LOCK; s.fails = 0; } store.set("ab_auth", s); }
async function loadProfile(u, extra){
  try {
    const ref = db.collection("customers").doc(u.uid), d = await ref.get();
    if (d.exists) profile = d.data();
    else { const base = { name: u.displayName || "", email: u.email || "", phone: "", address: "", consentVersion: "1.1", ...(extra || { ageConfirmed: true }) };
      await ref.set({ ...base, consentAt: TS(), createdAt: TS() }); profile = { ...base, consentAt: firebase.firestore.Timestamp.now() }; }
    if (profile.minor && profile.parentRequestId) { const r = await db.collection("parentRequests").doc(profile.parentRequestId).get(); parentStatus = r.data()?.status || ""; }
  } catch (e) { toast("Could not load account (" + (e.code || e.message) + ")"); }
}
function signinError(e){ return "Sign-in failed (" + (e.code || e.name || "unknown") + (e.message ? ": " + e.message : "") + "). " + (location.protocol === "file:" ? "Open this page from http://localhost or your hosted link, not from a file. " : ""); }
V.signin = () => {
  if (signedIn()) return go(store.get("ab_next", "#/home"));
  view(`<h1 class="pg">Sign in</h1><div class="seg"><button data-md="adult" class="${mode === "adult" ? "on" : ""}">I am 18 or older</button><button data-md="minor" class="${mode === "minor" ? "on" : ""}">I am under 18</button></div><div id="sw"></div>`);
  document.querySelectorAll("[data-md]").forEach(b => b.onclick = () => { mode = b.dataset.md; V.signin(); });
  mode === "adult" ? adultForm() : minorForm();
};
function adultForm(){
  $("#sw").innerHTML = `<p class="muted" style="margin-bottom:8px">Notice and consent under the Digital Personal Data Protection Act, 2023</p>
  <div class="consentbox"><p><strong>What we process, and why</strong></p>${DATA_TABLE}<p>The shop and delivery partner see only what is needed for your order. We do not sell your data. You can withdraw consent, correct or erase your data any time from Account, or write to support.dsbccl@gmail.com.</p><p><a href="#/privacy">Read the full Privacy Notice</a> · <a href="#/terms">Terms of Use</a></p></div>
  <label class="ck"><input type="checkbox" id="age"><span>I confirm that I am 18 years of age or older.</span></label>
  <label class="ck" style="margin-top:0"><input type="checkbox" id="agree"><span>I have read the notice and give my free, specific and informed consent to the processing of my personal data for the purposes listed above.</span></label>
  <p class="err" id="ae" role="alert"></p><button class="btn wide" id="google">Give consent &amp; continue with Google</button><a class="btn ghost wide" href="#/home" onclick="toast('Without consent we cannot create an account. You can still browse.')">Decline</a>`;
  $("#google").onclick = async () => {
    const er = $("#ae"); er.textContent = "";
    if (!$("#age").checked) return er.textContent = "Please confirm that you are 18 or older. If you are under 18, use the “I am under 18” option.";
    if (!$("#agree").checked) return er.textContent = "Please read the notice and tick the consent box to continue.";
    const g = guard(); if (g) return er.textContent = g;
    try { const r = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); user = r.user; await loadProfile(user); store.set("ab_auth", { fails: 0, lockUntil: 0, last: Date.now() }); toast("Signed in"); go(store.get("ab_next", "#/home")); route(); }
    catch (e) { if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return; failed(); er.textContent = signinError(e); }
  };
}
function minorForm(){
  const rid = store.get("ab_req", "");
  $("#sw").innerHTML = `<div class="card"><h3>Under 18? A parent or guardian must approve</h3><p class="muted">1. Enter your parent or guardian’s email. 2. They receive a link and confirm that they own that email. 3. They review the privacy notice and approve. 4. You can then sign in with Google. We do not track or profile children and show no advertising.</p>
  <label for="pm">Parent or guardian’s email</label><input id="pm" type="email" autocomplete="off"><p class="err" id="me" role="alert"></p><button class="btn wide" id="sendp">Send verification link</button></div><div id="ps"></div>`;
  $("#sendp").onclick = async () => {
    const em = $("#pm").value.trim().toLowerCase(), er = $("#me"); er.textContent = "";
    if (!/^\S+@\S+\.\S+$/.test(em)) return er.textContent = "Enter a valid email address.";
    const g = guard(); if (g) return er.textContent = g;
    try {
      if (!auth.currentUser) await auth.signInAnonymously();
      const ref = db.collection("parentRequests").doc();
      await ref.set({ childUid: auth.currentUser.uid, parentEmail: em, status: "pending", createdAt: TS() });
      await auth.sendSignInLinkToEmail(em, { url: location.origin + location.pathname + "?req=" + ref.id + "#/parent", handleCodeInApp: true });
      store.set("ab_req", ref.id); toast("Verification link sent to " + em); minorForm();
    } catch (e) { failed(); er.textContent = "Could not send (" + (e.code || e.message) + ")."; }
  };
  if (!rid) return;
  if (reqUnsub) reqUnsub();
  reqUnsub = db.collection("parentRequests").doc(rid).onSnapshot(s => {
    const st = s.data()?.status, box = $("#ps"); if (!box) return;
    if (st === "approved") { box.innerHTML = `<div class="card"><h3>Approved by your parent or guardian</h3><button class="btn wide" id="gl">Continue with Google</button><p class="err" id="ge" role="alert"></p></div>`;
      $("#gl").onclick = async () => { try { const cu = auth.currentUser; if (!cu || !cu.isAnonymous) throw new Error("Please send a new verification link from this device."); const r = await cu.linkWithPopup(new firebase.auth.GoogleAuthProvider()); user = r.user; await loadProfile(user, { minor: true, parentRequestId: rid }); store.set("ab_req", ""); go(store.get("ab_next", "#/home")); route(); } catch (e) { $("#ge").textContent = signinError(e); } }; }
    else if (st === "declined") box.innerHTML = `<div class="card"><p class="err">Your parent or guardian declined. An account cannot be created.</p></div>`;
    else box.innerHTML = `<div class="card"><p class="muted">Waiting for your parent or guardian to open the link we emailed and approve. They should do this on their own device.</p></div>`;
  });
}
/* Parent opens the emailed link: verify mailbox, then approve or decline */
V.parent = () => {
  parentMode = true; const rid = new URLSearchParams(location.search).get("req");
  if (!rid || !auth.isSignInWithEmailLink(location.href)) return view(`<h1 class="pg">Parental approval</h1><div class="card"><p>This link is not valid. Ask the child to send a new verification link.</p></div>`);
  view(`<h1 class="pg">Parental approval</h1><div class="card"><p>To continue, confirm the email address where you received this link.</p><label for="pe2">Your email</label><input id="pe2" type="email"><p class="err" id="pee" role="alert"></p><button class="btn wide" id="pv">Verify email</button></div>`);
  $("#pv").onclick = async () => {
    try {
      await auth.signInWithEmailLink($("#pe2").value.trim().toLowerCase(), location.href);
      const d = await db.collection("parentRequests").doc(rid).get();
      view(`<h1 class="pg">Parental approval</h1><div class="card"><p>Your child has asked to create an Apna Bazar account to order groceries. As parent or guardian, please review how their data is used:</p><div class="consentbox">${DATA_TABLE}<p>No tracking, profiling or advertising is used for children. You can ask us to erase the account any time: support.dsbccl@gmail.com. <a href="#/privacy">Privacy Notice</a></p></div>
      <p class="err" id="pde" role="alert"></p><button class="btn wide" id="ok">I am the parent or guardian and I approve</button><button class="btn ghost wide" id="no">Decline</button></div>`);
      const decide = async st => { try { await db.collection("parentRequests").doc(d.id).update({ status: st, decidedAt: TS() }); await auth.signOut(); view(`<h1 class="pg">Thank you</h1><div class="card"><p>Your decision (${st}) has been recorded. You can close this page.</p></div>`); } catch (e) { $("#pde").textContent = "Could not record (" + (e.code || e.message) + ")."; } };
      $("#ok").onclick = () => decide("approved"); $("#no").onclick = () => decide("declined");
    } catch (e) { $("#pee").textContent = "Could not verify (" + (e.code || e.message) + ")."; }
  };
};

auth.onAuthStateChanged(async u => {
  user = u; profile = null; parentStatus = "";
  if (u && !u.isAnonymous && !parentMode) await loadProfile(u);
  route();
});
route();
</script></body></html>
